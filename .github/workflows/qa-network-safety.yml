name: QA network safety
on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'docs/design/**/*.mjs'
      - '.github/workflows/qa-network-safety.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'docs/design/**/*.mjs'
      - '.github/workflows/qa-network-safety.yml'
jobs:
  guard-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify guard rejects remote targets without any network I/O
        run: node --test scripts/lib/qa-network-guard.test.mjs
      - name: Reject known dangerous QA defaults
        shell: bash
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync } from 'node:fs';
          const paths = [
            'scripts/spokedu-home-launch-closure.mjs',
            'scripts/spokedu-home-editorial-qa.mjs',
            'scripts/spokedu-education-qa.mjs',
            'scripts/spokedu-home-commercial-qa.mjs',
            'scripts/spokedu-public-shell-qa.mjs',
            'scripts/spokedu-public-typography-qa.mjs',
            'scripts/spokedu-font-forensics-qa.mjs',
            'scripts/capture-home-editorial-prototype.mjs',
            'docs/design/phase-2a/run-phase2a-audit.mjs',
          ];
          for (const path of paths) {
            const code = readFileSync(path, 'utf8');
            if (!code.includes('assertLocalQaTarget(') || !code.includes('installLocalQaRouteGuard(')) {
              throw new Error('QA route guard removed from '+path);
            }
            if (/const PROD\\s*=\\s*['"`]https:\\/\\//.test(code) || /\\?\\?\\s*['"`]https:\\/\\/spokedu\\.kr/.test(code)) {
              throw new Error('Production QA target introduced in '+path);
            }
          }
          console.log('QA guard presence and defaults: PASS');
          EOF
