name: Admin Note QA

on:
  pull_request:
    paths:
      - 'app/admin/note/**'
      - 'app/api/admin/note/**'
      - 'app/lib/note/**'
      - '.github/workflows/admin-note-qa.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

concurrency:
  group: admin-note-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run test:admin-note
