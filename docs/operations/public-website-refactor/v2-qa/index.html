<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPOKEDU Public V2 · 로컬 전후 비교</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f3ff;color:#131b2e;font:15px/1.6 system-ui,sans-serif}header{padding:24px 4vw;background:#fff;border-bottom:1px solid #dce3ee}h1{font-size:24px;margin:0 0 8px}p{margin:8px 0}a{color:#004ac6}button,select{font:inherit;padding:8px 12px;min-height:44px;border:1px solid #c3c6d7;border-radius:8px;background:white;color:#131b2e}label{display:inline-flex;gap:8px;align-items:center;margin-right:16px}.tools{padding:16px 4vw;display:flex;gap:16px;flex-wrap:wrap}.panes{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:0 4vw 24px}.pane{background:white;min-width:0;border:1px solid #dce3ee;border-radius:12px;overflow:hidden}.pane h2{font-size:16px;margin:0;padding:12px 16px;border-bottom:1px solid #dce3ee}.viewport{height:75vh;overflow:auto;overscroll-behavior:contain}.viewport img{display:block;width:100%;height:auto}.links{padding:12px 16px}details{margin:0 4vw 24px;padding:20px;background:white;border-radius:12px}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.gallery a{display:block;padding:12px;border:1px solid #dce3ee;border-radius:8px}summary{cursor:pointer;font-weight:600}input{width:18px;height:18px}a:focus-visible,button:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #2563eb;outline-offset:3px}@media(max-width:700px){.panes{gap:8px;padding-inline:12px}.viewport{height:65vh}h1{font-size:21px}}
</style>
<header><h1>SPOKEDU Public V2 · 로컬 전후 비교</h1><p>실제 로컬 화면을 변경 전·후 동일 폭으로 캡처했습니다. 아래 두 화면은 함께 스크롤할 수 있습니다.</p><p><a href="REPORT.md">전체 결과 보고서</a> · <a href="results.json">화면·링크 검사 결과</a> · <a href="verification.json">검증 명령과 종료 코드</a></p></header>
<div class="tools"><label>표면 <select id="surface"><option value="home">홈 전체</option><option value="gnb-desktop">GNB 데스크톱</option><option value="gnb-mobile">GNB 모바일</option></select></label><label>화면 폭 <select id="width"><option>375</option><option>768</option><option>1024</option><option selected>1440</option><option>1920</option></select></label><label><input id="sync" type="checkbox" checked>비율에 맞춰 함께 스크롤</label></div>
<div class="panes"><article class="pane"><h2>변경 전</h2><div class="viewport" id="beforePane"><img id="before" alt="변경 전 로컬 화면"></div><div class="links"><a id="beforeLink" target="_blank">원본 크기로 열기</a></div></article><article class="pane"><h2>변경 후</h2><div class="viewport" id="afterPane"><img id="after" alt="변경 후 로컬 화면"></div><div class="links"><a id="afterLink" target="_blank">원본 크기로 열기</a></div></article></div>
<details open><summary>메인 6섹션과 주요 서브페이지</summary><p>섹션 링크는 1440px 캡처입니다. 각 원본 이미지는 after 폴더에서 다른 폭으로도 확인할 수 있습니다.</p><div class="gallery" id="gallery"></div></details>
<script>
const surface=document.getElementById('surface'),width=document.getElementById('width');
function update(){width.disabled=surface.value!=='home';const file=surface.value==='home'?`home-${width.value}.png`:`${surface.value}.png`;for(const side of ['before','after']){document.getElementById(side).src=`${side}/${file}`;document.getElementById(side+'Link').href=`${side}/${file}`;document.getElementById(side+'Pane').scrollTop=0}}
surface.addEventListener('change',update);width.addEventListener('change',update);update();let syncing=false;
for(const side of ['before','after']){document.getElementById(side+'Pane').addEventListener('scroll',()=>{if(syncing||!document.getElementById('sync').checked)return;syncing=true;const a=document.getElementById(side+'Pane'),b=document.getElementById((side==='before'?'after':'before')+'Pane');b.scrollTop=a.scrollTop/Math.max(1,a.scrollHeight-a.clientHeight)*(b.scrollHeight-b.clientHeight);requestAnimationFrame(()=>syncing=false)})}
const pages=[['Brand Hero & Quick Entry','section-brand'],['Why SPOKEDU','section-why-spokedu'],['4MOVE','section-education-system'],['SPOMOVE Experience','section-spomove-experience'],['실적과 수업사례','section-field-stories'],['Contact & Next Step','section-next-step'],['회사 소개','about'],['기관·학교','education'],['개인·소그룹','private'],['SPOMOVE','spomove'],['수업사례','records'],['SPOMAT','spomat'],['카탈로그','spomove-catalog'],['SPOKEDU LAB','spokedu-lab']];
for(const [label,file] of pages){const a=document.createElement('a');a.href=`after/${file}-1440.png`;a.target='_blank';a.textContent=label;document.getElementById('gallery').append(a)}
</script></html>
