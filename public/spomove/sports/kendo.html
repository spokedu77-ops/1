<!DOCTYPE html>
<html lang="ko">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:;">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SPOKEDU - SHADOW SLASH</title>

    <style>


        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #020202; overflow: hidden;
            font-family: 'Cinzel', 'Black Han Sans', sans-serif;
            color: white; user-select: none;
        }

        #gameCanvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
            filter: contrast(1.3) brightness(1.2) saturate(1.5);
        }

        /* 어두운 폭우 속 도장 배경 */
        .shadow-overlay {
            position: absolute; inset: 0; z-index: 10; pointer-events: none;
            background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.95) 100%);
            box-shadow: inset 0 0 150px rgba(0,0,0,1);
        }

        #ui-layer {
            position: absolute; inset: 0; z-index: 20; pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between;
        }

        /* 중앙 거합(발도) 텍스트 */
        .slash-text {
            font-family: 'Black Han Sans'; text-align: center; line-height: 1.1;
            text-shadow: 0 0 40px currentColor, 0 0 20px currentColor; color: #fff;
            transform: scale(0.1) rotate(-5deg); opacity: 0;
            transition: all 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            letter-spacing: 5px; position: absolute; top: 40%; left: 50%;
        }
        .slash-text.show { transform: translate(-50%, -50%) scale(1) rotate(-5deg); opacity: 1; }

        #start-screen {
            position: absolute; inset: 0; background: #000; z-index: 50;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        .draw-btn {
            background: transparent; color: #fff; border: 2px solid #fff; pointer-events: auto;
            box-shadow: 0 0 30px rgba(255,255,255,0.3), inset 0 0 15px rgba(255,255,255,0.1);
            padding: 20px 80px; font-size: 3rem; font-weight: 900; cursor: pointer;
            font-family: 'Cinzel'; transition: 0.1s; letter-spacing: 5px;
        }
        .draw-btn:hover { background: #fff; color: #000; transform: scale(1.05); }

        /* 화면을 가르는 섬광 플래시 */
        #blade-flash {
            position: absolute; inset: 0; background: #fff; z-index: 40;
            opacity: 0; pointer-events: none; mix-blend-mode: exclusion;
        }

    </style>
</head>
<body>
    <div id="start-screen">
        <h2 class="text-3xl text-gray-400 tracking-[0.5em] font-bold mb-4 font-['Cinzel']">WAIT IN THE SHADOWS</h2>
        <h1 class="text-7xl md:text-[9rem] font-black text-center text-white leading-none mb-12" style="text-shadow: 0 0 40px #fff;">SHADOW<br>SLASH</h1>
        <button id="start-btn" class="draw-btn">DRAW SWORD</button>
        <div class="mt-16 text-center font-['Black_Han_Sans'] text-2xl text-gray-400 space-y-3">
            <p>암흑 속에서 거대한 <span class="text-white text-3xl">4색 장벽(모노리스)</span>이 날아옵니다.</p>
            <p>움직이지 말고 코앞까지 올 때를 기다리십시오.</p>
            <p class="text-yellow-400 text-3xl mt-4">눈앞에서 멈추는 찰나, <span class="text-white text-4xl">같은 색의 매트</span>를 밟아</p>
            <p class="text-cyan-400 text-4xl">정확히 두 동강 내버리십시오!</p>
        </div>
    </div>

    <div class="shadow-overlay"></div>
    <div id="blade-flash"></div>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div class="flex justify-between p-8 text-2xl font-bold tracking-widest text-gray-500 font-['Cinzel']">
            <div>SLICED <span id="kill-count" class="text-white text-4xl ml-2">0</span></div>
            <div>STATUS <span class="text-cyan-400 text-2xl ml-2">WAITING...</span></div>
        </div>
        <div id="main-msg" class="slash-text text-[8rem]">일도양단!</div>
    </div>

    <script>
 window.__sportCue=3;window.__sportReduced=false;window.__sportNow=0;
 const sportFrames=new Map(),sportTimers=new Map();let sportId=0;
 window.requestAnimationFrame=cb=>{const id=++sportId;sportFrames.set(id,cb);return id};
 window.cancelAnimationFrame=id=>sportFrames.delete(id);
 window.setTimeout=(cb,ms=0)=>{const id=++sportId;sportTimers.set(id,{cb,due:window.__sportNow+ms});return id};
 window.clearTimeout=id=>sportTimers.delete(id);
 </script><script>
        // ==========================================
        // 1. 오디오 엔진
        // ==========================================
        let audioCtx;
        const sfx = { rain: null, rainGain: null };

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function startRainSound() {
            if(!audioCtx) return;
            const bufferSize = audioCtx.sampleRate * 2;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for(let i=0; i<bufferSize; i++) data[i] = Math.random() * 2 - 1;

            sfx.rain = audioCtx.createBufferSource(); sfx.rain.buffer = buffer; sfx.rain.loop = true;
            const filter = audioCtx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 400;
            sfx.rainGain = audioCtx.createGain(); sfx.rainGain.gain.value = 0.8;

            sfx.rain.connect(filter); filter.connect(sfx.rainGain); sfx.rainGain.connect(audioCtx.destination);
            sfx.rain.start();
        }

        function playApproach(duration) {
            return;
            const t = audioCtx.currentTime;
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.type = 'sine'; osc.frequency.setValueAtTime(100, t); osc.frequency.exponentialRampToValueAtTime(600, t + duration);
            gain.gain.setValueAtTime(0, t); gain.gain.linearRampToValueAtTime(0.6, t + duration);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(t); osc.stop(t + duration);
        }

        function playKatanaSlash() {
            return;
            const t = audioCtx.currentTime;

            // 금속 베는 소리
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(2500, t); osc.frequency.exponentialRampToValueAtTime(200, t + 0.2);
            gain.gain.setValueAtTime(1.5, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(t); osc.stop(t + 0.3);

            // 파열음 (단단한 돌/유리가 잘리는 소리)
            const nBuf = audioCtx.createBuffer(1, audioCtx.sampleRate*0.3, audioCtx.sampleRate);
            const nData = nBuf.getChannelData(0); for(let i=0; i<nData.length; i++) nData[i] = Math.random()*2-1;
            const noise = audioCtx.createBufferSource(); noise.buffer = nBuf;
            const nFilter = audioCtx.createBiquadFilter(); nFilter.type = 'highpass'; nFilter.frequency.value = 2000;
            const nGain = audioCtx.createGain(); nGain.gain.setValueAtTime(2, t); nGain.gain.exponentialRampToValueAtTime(0.01, t+0.2);
            noise.connect(nFilter); nFilter.connect(nGain); nGain.connect(audioCtx.destination); noise.start(t);

            // 묵직한 타격감 (Hit-stop Bass)
            const sub = audioCtx.createOscillator(); const subGain = audioCtx.createGain();
            sub.type = 'sine'; sub.frequency.setValueAtTime(150, t); sub.frequency.exponentialRampToValueAtTime(10, t+0.6);
            subGain.gain.setValueAtTime(4, t); subGain.gain.exponentialRampToValueAtTime(0.01, t+0.6);
            sub.connect(subGain); subGain.connect(audioCtx.destination); sub.start(t); sub.stop(t+0.6);
        }

        // ==========================================
        // 2. 3D 렌더링 & 슬라이스 물리 엔진
        // ==========================================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        let width, height, cx, cy;

        let screenShake = 0;
        let hitStopFrames = 0; // 타격 시 화면 정지 (극강의 타격감)
        let kills = 0;
        let gameActive = false;
        let globalTime = 0;

        const FOV = Math.min(800, window.innerWidth * 1.2, window.innerHeight * 1.2);

        function resize() {
            width = window.innerWidth; height = window.innerHeight;
            canvas.width = width; canvas.height = height;
            cx = width / 2; cy = height / 2;
        }
        window.addEventListener('resize', resize); resize();

        function project(x, y, z) {
            if(z < 1) return { scale: 0 };
            const scale = FOV / z;
            return { x: cx + x * scale, y: cy + y * scale, scale: scale };
        }

        function hexToRgb(hex) {
            const bigint = parseInt(hex.replace('#', ''), 16);
            return `${(bigint >> 16) & 255}, ${(bigint >> 8) & 255}, ${bigint & 255}`;
        }

        // 4가지 방향과 절단 각도
        const TARGETS = [
            { x: -400, y: -200, hex: '#FF1A40', angle: Math.PI/4 },     // TL (우하단으로 벰)
            { x: 400, y: -200, hex: '#FFCC00', angle: -Math.PI/4 },     // TR (좌하단으로 벰)
            { x: -400, y: 200, hex: '#00FF66', angle: -Math.PI/4 },     // BL (우상단으로 벰)
            { x: 400, y: 200, hex: '#00CCFF', angle: Math.PI/4 }        // BR (좌상단으로 벰)
        ];

        let solidBlocks = [];
        let slicedFragments = [];
        let rainParticles = [];
        let slashes = [];
        let sparks = [];

        // 비 파티클
        for(let i=0; i<300; i++) {
            rainParticles.push({
                x: Math.random() * width, y: Math.random() * height,
                l: Math.random() * 20 + 10, v: Math.random() * 20 + 15
            });
        }

        // 화면을 가르는 거대한 검기
        class SwordArc {
            constructor(color, angle) {
                this.x = cx; this.y = cy;
                this.color = color;
                this.angle = angle;
                this.life = 1.0;
            }
            update() { this.life -= 0.08; }
            draw(ctx) {
                if(this.life <= 0) return;
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                ctx.globalAlpha = this.life;
                ctx.globalCompositeOperation = 'lighter';

                // 일직선 검기
                ctx.beginPath(); ctx.moveTo(-2000, 0); ctx.lineTo(2000, 0);
                ctx.strokeStyle = this.color; ctx.lineWidth = 30 * this.life;
                ctx.shadowBlur = 40; ctx.shadowColor = this.color; ctx.stroke();
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 8 * this.life; ctx.stroke();

                ctx.restore();
            }
        }

        class Spark {
            constructor(x, y, color) {
                this.x = x; this.y = y; this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 50 + 20;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.size = Math.random() * 8 + 3;
                this.life = 1.0; this.decay = Math.random() * 0.04 + 0.02;
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                this.vx *= 0.9; this.vy *= 0.9;
                this.life -= this.decay;
            }
            draw(ctx) {
                if(this.life <= 0) return;
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10; ctx.shadowColor = this.color;
                ctx.fillRect(this.x, this.y, this.size, this.size);
                ctx.shadowBlur = 0;
            }
        }

        // 단단한 물체 (거대한 에너지 장벽) 그리기 함수 - [면적 3배 확대]
        function drawSolidObelisk(ctx, hexColor) {
            ctx.fillStyle = `rgba(${hexToRgb(hexColor)}, 0.15)`;
            ctx.strokeStyle = hexColor;
            ctx.lineWidth = 8;
            ctx.shadowBlur = 40; ctx.shadowColor = hexColor;

            // 거대한 육각형 모노리스 (화면을 가득 채우는 크기)
            ctx.beginPath();
            ctx.moveTo(-180, -220); ctx.lineTo(180, -220);
            ctx.lineTo(220, -180); ctx.lineTo(220, 180);
            ctx.lineTo(180, 220); ctx.lineTo(-180, 220);
            ctx.lineTo(-220, 180); ctx.lineTo(-220, -180);
            ctx.closePath();
            ctx.fill(); ctx.stroke();

            // 내부 거대 코어 발광체
            ctx.fillStyle = hexColor;
            ctx.globalAlpha = 0.6;
            ctx.fillRect(-100, -140, 200, 280);

            // 초백색 심장부
            ctx.fillStyle = '#fff';
            ctx.globalAlpha = 1.0;
            ctx.fillRect(-40, -100, 80, 200);
            ctx.shadowBlur = 0;
        }

        // 완벽하게 반으로 쪼개져 날아가는 파편
        class SlicedFragment {
            constructor(x, y, z, hexColor, sliceAngle, isTop) {
                this.x = x; this.y = y; this.z = z;
                this.hexColor = hexColor;
                this.sliceAngle = sliceAngle;
                this.isTop = isTop;

                // 절단면의 수직 방향으로 강하게 튕겨나감
                const explodeAngle = sliceAngle + (isTop ? -Math.PI/2 : Math.PI/2);

                // 거대한 물체에 맞게 폭발 속도와 회전 속도 조정
                const force = 12 + Math.random() * 4;

                this.vx = Math.cos(explodeAngle) * force;
                this.vy = Math.sin(explodeAngle) * force;
                this.vz = 0; // 화면으로 돌진하지 않고 그 자리에서 쪼개져 떨어지도록 변경

                // 화면에 닿기 전에 갈라지므로, 쩍! 벌어지는 틈(Gap)을 좀 더 확실하게 줌
                this.x += Math.cos(explodeAngle) * 40;
                this.y += Math.sin(explodeAngle) * 40;

                this.rot = 0;
                this.rotSpeed = (isTop ? 1 : -1) * (0.015 + Math.random() * 0.015);
                this.life = 1.0;
            }

            update() {
                this.vy += 0.5; // 중력 완화
                this.x += this.vx; this.y += this.vy; this.z += this.vz;
                this.rot += this.rotSpeed;
                this.life -= 0.015;
            }

            draw(ctx) {
                if (this.life <= 0) return;
                const proj = project(this.x, this.y, this.z);
                if (proj.scale <= 0) return;

                ctx.save();
                ctx.translate(proj.x, proj.y);
                ctx.scale(proj.scale, proj.scale);
                ctx.rotate(this.rot);

                ctx.globalAlpha = this.life;

                // 물체가 커졌으므로 클리핑 박스 영역도 대폭 확장
                ctx.save();
                ctx.rotate(this.sliceAngle);
                ctx.beginPath();
                if (this.isTop) {
                    ctx.rect(-2000, -2000, 4000, 1996); // 윗면 클리핑 (가운데 갭 4px)
                } else {
                    ctx.rect(-2000, 4, 4000, 2000); // 아랫면 클리핑
                }
                ctx.clip();
                ctx.rotate(-this.sliceAngle);

                drawSolidObelisk(ctx, this.hexColor);
                ctx.restore();

                // 거대해진 물체에 맞게 절단면(마그마 단면) 선 길이 대폭 연장
                ctx.rotate(this.sliceAngle);
                ctx.beginPath();
                ctx.moveTo(-300, this.isTop ? -4 : 4);
                ctx.lineTo(300, this.isTop ? -4 : 4);

                // 번쩍이는 외부 섬광
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 15;
                ctx.shadowBlur = 60; ctx.shadowColor = this.hexColor;
                ctx.stroke();

                // 선명한 단면 내부 코어 선
                ctx.strokeStyle = this.hexColor; ctx.lineWidth = 6;
                ctx.shadowBlur = 0; ctx.stroke();

                ctx.restore();
            }
        }

        // 다가오는 온전한 타겟 블록
        class SolidTarget {
            constructor(posIdx) {
                this.info = TARGETS[posIdx];
                this.startX = this.info.x * 2; this.startY = this.info.y * 2; this.startZ = 6000;
                this.x = this.startX; this.y = this.startY; this.z = this.startZ;

                this.targetX = this.info.x * 0.5; this.targetY = this.info.y * 0.5;
                this.targetZ = 600; // 화면을 가득 채우기 직전 (썰리는 단면이 가장 잘 보이는 거리)

                this.flyTime = 0;
                this.maxFlyTime = window.__sportCue * 60; // 1초 동안 접근

                playApproach(this.maxFlyTime / 60);
                this.trail = [];
            }

            update() {
                this.flyTime++;
                const t = this.flyTime / this.maxFlyTime;
                parent.postMessage({type:'spomove-sport-timing',progress:Math.min(1,t)},'*');

                // 점점 가속하며 다가옴 (Ease-In)
                const easeIn = Math.pow(t, 3);

                this.x = this.startX + (this.targetX - this.startX) * easeIn;
                this.y = this.startY + (this.targetY - this.startY) * easeIn;
                this.z = this.startZ + (this.targetZ - this.startZ) * easeIn;

                this.trail.push({x: this.x, y: this.y, z: this.z});
                if(this.trail.length > 15) this.trail.shift();

                // 타격 타이밍 도달 (수동적 대기의 끝)
                if (t >= 1.0) {
                    this.executeSlice();
                }
            }

            executeSlice() {
                // 1. 역동적인 히트 스톱 (시간 정지 + 흑백 반전)
                hitStopFrames = 12; // [수정] 갈라진 채 멈춘 모습을 더 오래 감상하도록 늘림
                canvas.style.filter = "invert(1) contrast(2) saturate(0)";
                setTimeout(() => { canvas.style.filter = "contrast(1.3) brightness(1.2) saturate(1.5)"; }, 120);

                // 2. 타격 피드백
                playKatanaSlash();
                screenShake = window.__sportReduced ? 0 : 10; // 화면 지진

                const bFlash = document.getElementById('blade-flash');
                bFlash.style.backgroundColor = this.info.hex;
                bFlash.style.opacity = '0.8'; setTimeout(() => bFlash.style.opacity = '0', 100);

                // 3. 검기 및 파티클 생성
                slashes.push(new SwordArc(this.info.hex, this.info.angle));
                const p = project(this.x, this.y, this.z);
                for(let i=0; i<40; i++) sparks.push(new Spark(p.x, p.y, this.info.hex));

                // 4. [핵심] 타겟을 삭제하고 두 개의 파편으로 분리 (일도양단)
                slicedFragments.push(new SlicedFragment(this.x, this.y, this.z, this.info.hex, this.info.angle, true));
                slicedFragments.push(new SlicedFragment(this.x, this.y, this.z, this.info.hex, this.info.angle, false));

                // 5. 메시지 연출
                const msg = document.getElementById('main-msg');
                msg.style.color = this.info.hex;
                msg.style.textShadow = `0 0 40px ${this.info.hex}`;
                msg.classList.add('show');
                setTimeout(() => msg.classList.remove('show'), 300);

                kills++; window.__sportHit(TARGETS.indexOf(this.info));
                document.getElementById('kill-count').innerText = kills;
            }

            draw(ctx) {
                // 꼬리 (잔상)
                if(this.trail.length > 1) {
                    ctx.beginPath();
                    const firstP = project(this.trail[0].x, this.trail[0].y, this.trail[0].z);
                    ctx.moveTo(firstP.x, firstP.y);
                    for(let i=1; i<this.trail.length; i++) {
                        const p = project(this.trail[i].x, this.trail[i].y, this.trail[i].z);
                        ctx.lineTo(p.x, p.y);
                    }
                    ctx.strokeStyle = this.info.hex;
                    ctx.lineWidth = 40 * project(this.x, this.y, this.z).scale;
                    ctx.lineCap = 'round';
                    ctx.shadowBlur = 40; ctx.shadowColor = this.info.hex;
                    ctx.globalAlpha = 0.3; ctx.stroke(); ctx.globalAlpha = 1.0; ctx.shadowBlur = 0;
                }

                // 물체 렌더링
                const proj = project(this.x, this.y, this.z);
                if (proj.scale <= 0) return;

                ctx.save();
                ctx.translate(proj.x, proj.y);
                ctx.scale(proj.scale, proj.scale);

                drawSolidObelisk(ctx, this.info.hex);

                ctx.restore();
            }
        }

        // ==========================================
        // 3. 메인 게임 루프 & 타임라인
        // ==========================================
        function drawBackground() {
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = 'rgba(2, 2, 4, 0.4)'; // 잔상 배경
            ctx.fillRect(0, 0, width, height);

            ctx.save();

            if (screenShake > 0) {
                ctx.translate((Math.random()-0.5)*screenShake, (Math.random()-0.5)*screenShake);
                screenShake *= 0.8; if(screenShake < 0.5) screenShake = 0;
            }

            // 폭우 렌더링 (사선으로 거세게 내림)
            ctx.globalCompositeOperation = 'lighter';
            ctx.strokeStyle = 'rgba(100, 150, 255, 0.3)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            rainParticles.forEach(p => {
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(p.x - p.l*0.5, p.y + p.l);
                p.y += p.v; p.x -= p.v*0.5;
                if(p.y > height) { p.y = -20; p.x = Math.random() * width + 200; }
            });
            ctx.stroke();

            // 물체들 업데이트 및 렌더링
            for (let i = solidBlocks.length - 1; i >= 0; i--) {
                const block = solidBlocks[i];
                block.update();

                // 타격되어 파편으로 변환되었으면(update 내부에서 처리됨), 블록 리스트에서 제거
                if (block.z <= block.targetZ) {
                    solidBlocks.splice(i, 1);
                } else {
                    block.draw(ctx);
                }
            }

            for (let i = slicedFragments.length - 1; i >= 0; i--) {
                const frag = slicedFragments[i];
                frag.update(); frag.draw(ctx);
                if (frag.life <= 0) slicedFragments.splice(i, 1);
            }

            for (let i = slashes.length - 1; i >= 0; i--) {
                slashes[i].update(); slashes[i].draw(ctx);
                if (slashes[i].life <= 0) slashes.splice(i, 1);
            }

            for (let i = sparks.length - 1; i >= 0; i--) {
                sparks[i].update(); sparks[i].draw(ctx);
                if (sparks[i].life <= 0) sparks.splice(i, 1);
            }

            ctx.restore();
        }

        let sequence = [];
        let currentStep = 0;
        let startTime = 0;

        function createTargetPattern(posIdx, timeOffset) {
            return [
                { t: timeOffset, action: () => {
                    solidBlocks.push(new SolidTarget(posIdx));
                }}
            ];
        }

        function buildSequence() {
            sequence = [];
            let t = 2.0;

            // 처음엔 기다림의 텐션을 주기 위해 천천히 하나씩
            sequence.push(...createTargetPattern(0, t)); t += 3.0; // Red
            sequence.push(...createTargetPattern(3, t)); t += 2.5; // Blue
            sequence.push(...createTargetPattern(1, t)); t += 2.0; // Yellow

            // 후반부 폭풍 베기
            for(let i=0; i<15; i++) {
                sequence.push(...createTargetPattern(Math.floor(Math.random() * 4), t));
                t += Math.max(0.8, 2.0 - (i * 0.1));
            }

            sequence.push({ t: t + 3.0, action: () => {
                document.getElementById('start-screen').style.display = 'flex';
                gameActive = false;
                if(sfx.rainGain) sfx.rainGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 2);
            }});
        }

        function animate() {
            requestAnimationFrame(animate);

            // 타격 시 프레임 업데이트를 멈춰서 화면이 얼어붙게 함 (Hit-Stop)
            if (hitStopFrames > 0) {
                hitStopFrames--;
                return;
            }

            globalTime += 0.05;

            drawBackground();

            if(gameActive) {
                const now = (window.__sportNow - startTime) / 1000;
                if (currentStep < sequence.length && now >= sequence[currentStep].t) {
                    sequence[currentStep].action();
                    currentStep++;
                }
            }
        }

        document.getElementById('start-btn').addEventListener('click', () => {
            initAudio();
            startRainSound();
            document.getElementById('start-screen').style.opacity = '0';
            setTimeout(() => document.getElementById('start-screen').style.display = 'none', 300);

            gameActive = true;
            kills = 0; document.getElementById('kill-count').innerText = '0';
            solidBlocks = []; slicedFragments = []; slashes = []; sparks = [];

            buildSequence();
            startTime = window.__sportNow;
            currentStep = 0;
        });

        // 렌더링 루프 시작
        requestAnimationFrame(animate);
    </script>
<style>#start-screen,#ui-layer>div:first-child{display:none!important}.thrust-text,.slash-text{font-size:clamp(36px,9vw,128px);white-space:nowrap}.shadow-overlay{box-shadow:inset 0 0 70px #0009}#pierce-flash,#blade-flash{opacity:0!important}</style><script>
 let sportStarted=false,sportSpawned=0,sportPassed=0,sportDue=0,sportTotal=20,sportAccumulator=0;
 window.__sportHit=index=>{sportPassed++;sportDue=window.__sportNow+900;parent.postMessage({type:'spomove-sport-hit',index},'*')};
 const sportSendReady=()=>parent.postMessage({type:'spomove-sport-ready'},'*');
 addEventListener('message',event=>{
 if(event.source!==parent||!event.data||typeof event.data.type!=='string')return;
 const data=event.data;
 if(data.type==='spomove-sport-hello'){sportSendReady();return}
 if(data.type==='spomove-sport-config'){
 window.__sportCue=Math.max(1,Math.min(6,Number(data.seconds)||3));sportTotal=Math.max(1,Math.min(30,Number(data.rounds)||20));window.__sportReduced=!!data.reduced;return}
 if(data.type==='spomove-sport-stop'){sportStarted=false;sportFrames.clear();sportTimers.clear();return}
 if(data.type==='spomove-sport-start'){sportStarted=true;gameActive=false;sportDue=500;return}
 if(data.type!=='spomove-sport-tick'||!sportStarted)return;
 sportAccumulator+=Math.max(0,Math.min(.1,Number(data.delta)||0));
 while(sportAccumulator>=1/60){
 sportAccumulator-=1/60;window.__sportNow+=1000/60;
 if(sportSpawned<sportTotal&&solidBlocks.length===0&&window.__sportNow>=sportDue){solidBlocks.push(new SolidTarget(Math.floor(Math.random()*4)));sportSpawned++;sportDue=Infinity}
 for(const [id,timer] of [...sportTimers])if(timer.due<=window.__sportNow){sportTimers.delete(id);timer.cb()}
 const frames=[...sportFrames.values()];sportFrames.clear();for(const frame of frames)frame(window.__sportNow);
 if(sportPassed===sportTotal&&window.__sportNow>=sportDue){sportStarted=false;parent.postMessage({type:'spomove-sport-complete'},'*');break}
 }
 });addEventListener('error',()=>parent.postMessage({type:'spomove-sport-failed'},'*'));sportSendReady();
 </script></body>
