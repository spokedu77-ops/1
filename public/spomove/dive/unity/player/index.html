<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, user-scalable=no">
  <title>SPOMOVE</title>
  <style>
    html, body, #unity-canvas { width:100%; height:100%; margin:0; padding:0; border:0; display:block; overflow:hidden; background:#231F20; }
    #unity-canvas { position:fixed; inset:0; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <script src="Build/player.loader.js"></script>
  <script>
    const canvas = document.querySelector('#unity-canvas');
    const MAX_RENDER_WIDTH = 1920;
    const MAX_RENDER_HEIGHT = 1080;
    function resizeUnityBackingStore() {
      const cssWidth = Math.max(1, canvas.clientWidth);
      const cssHeight = Math.max(1, canvas.clientHeight);
      const scale = Math.min(window.devicePixelRatio || 1, MAX_RENDER_WIDTH / cssWidth, MAX_RENDER_HEIGHT / cssHeight);
      canvas.width = Math.max(1, Math.round(cssWidth * scale));
      canvas.height = Math.max(1, Math.round(cssHeight * scale));
    }
    resizeUnityBackingStore();
    window.addEventListener('resize', resizeUnityBackingStore, { passive: true });
    let spomoveUnityInstance = null;
    const pendingMessages = [];
    function deliverToUnity(method, value) {
      if (!spomoveUnityInstance) { pendingMessages.push([method, value]); return; }
      spomoveUnityInstance.SendMessage('DIVE_WebBridge', method, value || '');
    }
    window.addEventListener('message', (event) => {
      const message = event.data || {};
      if (message.type === 'SPOMOVE_SESSION_CONFIG') {
        const payload = typeof message.config === 'string' ? message.config : JSON.stringify(message.config || message.payload || {});
        deliverToUnity('ConfigureSession', payload);
      } else if (message.type === 'SPOMOVE_SESSION_START' || message.type === 'START') {
        deliverToUnity('StartSession', '');
      } else if (message.type === 'SPOMOVE_SESSION_STOP' || message.type === 'STOP') {
        deliverToUnity('StopSession', '');
      }
    });
    createUnityInstance(canvas, {
      arguments: [],
      dataUrl: 'Build/player.data',
      frameworkUrl: 'Build/player.framework.js',
      codeUrl: 'Build/player.wasm',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: "DefaultCompany",
      productName: "SPOMOVE",
      productVersion: "0.1.0",
      matchWebGLToCanvasSize: false,
    }).then((unityInstance) => {
      spomoveUnityInstance = unityInstance;
      pendingMessages.splice(0).forEach(([method, value]) => deliverToUnity(method, value));
      window.parent.postMessage({ type: 'SPOMOVE_UNITY_READY' }, '*');
    }).catch((message) => console.error('SPOMOVE Unity startup failed', message));
  </script>
</body>
</html>
